name: Batik Detection IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm install

      - name: Build Vite
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Archive App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -archivePath ios/build/App.xcarchive \
            archive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package IPA manually
        run: |
          # Masuk ke folder tempat aplikasi hasil build berada
          cd ios/build/App.xcarchive/Products/Applications
          
          # Struktur IPA wajib: Folder 'Payload' berisi 'App.app'
          mkdir Payload
          mv App.app Payload/
          
          # Zip folder Payload menjadi file .ipa
          zip -r App.ipa Payload
          
          # Pindahkan file .ipa yang sudah jadi ke folder ios/build agar bisa di-upload
          mv App.ipa ../../../
          
          echo "IPA created successfully at ios/build/App.ipa"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/build/App.ipa